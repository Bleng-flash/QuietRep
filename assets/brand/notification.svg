<!--
  Status-bar notification glyph - the `barbell` glyph from Ionicons.

  Source:   node_modules/ionicons/dist/svg/barbell.svg
  Project:  Ionicons by Ionic - https://ionic.io/ionicons
  Licence:  MIT

  WHY THIS IS A SEPARATE FILE FROM mark.svg. The notification icon renders at ~24dp, roughly a
  quarter the size of a launcher tile. The MDI dumbbell used for the mark is drawn on a thin
  diagonal, and at 24dp its bar and plates thin out into an ambiguous diagonal squiggle - it stops
  reading as a dumbbell. This Ionicons barbell is horizontal and much chunkier, so it survives.

  A detailed mark plus a simplified glyph is the normal split for exactly this reason; the two do
  not need to be the same drawing, only the same idea.

  There is a second reason this particular glyph: Ionicons `barbell` is ALREADY the app's session
  icon - ResumeSessionBanner renders it, and EmptyState uses `barbell-outline`. So the shape a user
  sees in the status bar is the shape they already associate with a live workout in this app.

  INK SLOT. #ff00ff is a sentinel, replaced at build time - see mark.svg. This file only ever
  produces an alpha-only output, so in practice it is always substituted for white.
-->
