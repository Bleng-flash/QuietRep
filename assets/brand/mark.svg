  Copied in rather than read from node_modules at build time, so the mark is version-controlled
  with the app and the icon packages can be uninstalled once the choice is made. The geometry
  below is unmodified; the only change is the fill.

  INK SLOT. #ff00ff is a sentinel, not a real colour. scripts/build-brand-assets.mjs replaces it
  with the brand green for the colour outputs and with white for the alpha-only ones. Magenta on
  purpose: if it ever escapes substitution the output screams rather than shipping a
  plausible-looking green.

  Note the mark is DIAGONAL, which constrains how large it can be drawn in the adaptive-icon
  layers: its extreme points sit at the corners of its bounding box, so it is the worst case for
  a circular launcher mask. See the coverage table in build-brand-assets.mjs.
-->
